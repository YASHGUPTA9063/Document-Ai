server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Uploads go through this proxy — nginx's 1m default would 413 most PDFs.
    client_max_body_size 100m;

    # Reverse-proxy the API so the browser only ever talks to this one port.
    # Keeps the app working with a single inbound rule in the Azure NSG, and
    # makes every request same-origin (no CORS, no public IP baked into the
    # JS bundle at build time).
    #
    # The upstream is held in a variable and resolved via Docker's embedded DNS
    # at request time; with a literal `proxy_pass http://backend:8000/` nginx
    # resolves at startup and refuses to boot whenever the backend container is
    # down. The regex capture replaces the URI-rewriting that a trailing slash
    # would normally do (unavailable once proxy_pass contains a variable).
    location ~ ^/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream/$1$is_args$args;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Signature/face verification runs ML inference plus several Mistral
        # calls, and batch upload accepts up to 20 files — both blow past the
        # 60s default long before the client's own timeout.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_request_buffering off;
    }

    # Hashed asset filenames (Vite build output) can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback so react-router-dom client-side routes survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
