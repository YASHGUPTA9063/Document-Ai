server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Documents can be large; the backend caps at 50MB
    # (config/platform.yaml -> pipelines.document_processing.max_file_size_mb)
    client_max_body_size 64m;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Docker's embedded DNS. Combined with the $upstream variables below this
    # defers upstream name resolution to request time — otherwise nginx resolves
    # "app" while loading the config and exits with "host not found in upstream"
    # whenever the backend isn't already running.
    resolver         127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Hashed Vite assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API so the browser never makes a cross-origin request.
    # No URI part after the variable => the original request URI is forwarded as-is.
    location /api/ {
        set $api_upstream http://app:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Document pipelines are slow; don't cut them off at nginx's 60s default
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    location = /health {
        set $health_upstream http://app:8000;
        proxy_pass $health_upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback — react-router owns client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
