[pytest]
testpaths = tests
# Load testing lives under tests/load but needs a running server and locust,
# so it is not part of the unit suite.
norecursedirs = load
asyncio_mode = strict
# Pinned explicitly: pytest-asyncio warns on every run otherwise, and its
# default is scheduled to change to function scope in a future release.
asyncio_default_fixture_loop_scope = function
