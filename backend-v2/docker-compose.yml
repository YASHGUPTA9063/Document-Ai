version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: document_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: document_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: document_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: document_ai_app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Mistral Managed Workflows — these must be set at process level
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME}
      - MISTRAL_WORKFLOW_ID=${MISTRAL_WORKFLOW_ID}
      # Temporal connection to Mistral's managed cloud (overrides localhost:7233 default)
      - TEMPORAL_SERVER_URL=${TEMPORAL_SERVER_URL}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
      - TEMPORAL_TLS=${TEMPORAL_TLS}
      - TEMPORAL_API_KEY=${TEMPORAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./migrations:/app/migrations
    restart: unless-stopped

  worker:
    build: .
    container_name: document_ai_worker
    command: arq worker.WorkerSettings
    env_file: .env
    environment:
      # Mistral Managed Workflows — these must be set at process level
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - DEPLOYMENT_NAME=${DEPLOYMENT_NAME}
      - MISTRAL_WORKFLOW_ID=${MISTRAL_WORKFLOW_ID}
      # Temporal connection to Mistral's managed cloud (overrides localhost:7233 default)
      - TEMPORAL_SERVER_URL=${TEMPORAL_SERVER_URL}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE}
      - TEMPORAL_TLS=${TEMPORAL_TLS}
      - TEMPORAL_API_KEY=${TEMPORAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config
      - ./migrations:/app/migrations
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
