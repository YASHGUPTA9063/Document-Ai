# Document-AI — single-host deployment.
#
# Three backend roles from one image, because they scale and fail differently:
#
#   api              stateless HTTP. Runs N uvicorn workers. Never executes a
#                    pipeline step.
#   dispatcher       drains the Redis queue and starts Mistral Studio runs,
#                    with retry and backoff. Cheap, IO-bound.
#   workflow-worker  registers with Studio under DEPLOYMENT_NAME and executes
#                    the activities Studio dispatches back. This is where the
#                    OCR, the vision calls and the DINOv2 inference happen, so
#                    it is the one to scale:
#                        docker compose up -d --scale workflow-worker=3
#
#   docker compose up -d --build
#
# Secrets and agent IDs come from backend-v2/.env (see .env.example).

x-backend-image: &backend-image
  build:
    context: ./backend-v2
    dockerfile: Dockerfile
  image: document-ai-backend:latest

x-backend-env: &backend-env
  # Container-network overrides. These deliberately win over backend-v2/.env,
  # which points at localhost for running outside Docker.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-document_ai}
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /app/storage
  EXECUTION_MODE: queue
  RUN_WORKFLOW_WORKER_IN_API: "false"
  # The document chat's Mistral library. backend-v2/.env is shared with local
  # development and carries the same API key, so without this the deployment
  # would find and use the library a developer's laptop created — answering
  # from their test uploads. A distinct name makes this stack create its own on
  # first use; set MISTRAL_LIBRARY_NAME in the root .env to pick another.
  MISTRAL_LIBRARY_NAME: ${MISTRAL_LIBRARY_NAME:-document-ai-prod}

x-backend-common: &backend-common
  <<: *backend-image
  env_file:
    - ./backend-v2/.env
  volumes:
    - app_storage:/app/storage
    # Provider and resilience settings are tunable without a rebuild.
    - ./backend-v2/config:/app/config:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-document_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready reports ready before the database
      # itself has been created, and the first migration then fails.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-document_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    <<: *backend-common
    environment:
      <<: *backend-env
      # The API owns migrations; the other two roles skip them so three
      # containers starting together don't race for the same Alembic lock.
      RUN_MIGRATIONS: "true"
      # Trust X-Forwarded-Proto from nginx (another container, so not the
      # 127.0.0.1 uvicorn trusts by default). Without it, redirects the API
      # generates point at http:// and an HTTPS page blocks them as mixed
      # content.
      FORWARDED_ALLOW_IPS: "*"
    command:
      - uvicorn
      - main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # Safe now that the workflow worker is its own process. While it was an
      # asyncio task inside this one, a second uvicorn worker registered a
      # duplicate Studio pool and every activity ran twice.
      - --workers
      - "${API_WORKERS:-2}"
    # API_BIND=127.0.0.1:8000 keeps the API off the public interface; nginx in
    # the frontend container still reaches it over the compose network.
    ports:
      - "${API_BIND:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  dispatcher:
    <<: *backend-common
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    command: ["arq", "worker.WorkerSettings"]
    # The image's healthcheck curls :8000, which only the api role serves.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  workflow-worker:
    <<: *backend-common
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    command: ["python", "workflow_worker.py"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    # DINOv2 plus the torch runtime; raise if you scale replicas on a small host.
    deploy:
      resources:
        limits:
          memory: 4g

  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
      args:
        # Relative — nginx in this image proxies /api/ through to api:8000,
        # so the browser only needs port 5173 reachable and no host is baked
        # into the JS bundle.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: document-ai-frontend:latest
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_storage:
